name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mitespotter
          POSTGRES_PASSWORD: mitespotter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitespotter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MITESPOTTER_TEST_DATABASE_URL: postgresql+psycopg://mitespotter:mitespotter@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run coverage json -o coverage.json
      - run: uv run python tools/check_coverage.py coverage.json 85
