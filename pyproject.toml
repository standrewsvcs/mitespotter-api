[project]
name = "mitespotter-api"
version = "0.1.0"
description = "Mitespotter's user, image & annotation database API and file server"
readme = "README.md"
authors = [
    { name = "MutantCacti", email = "mutantcacti@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "advanced-alchemy>=1.12",
    "alembic>=1.20.1",
    "boto3>=1.43.126",
    "litestar>=2.24.0",
    "msgspec>=0.21.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
mitespotter-api = "mitespotter_api:main"
main = "mitespotter_api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
