# deploy/cloudflared.example.yml
# Named Cloudflare tunnel for the public dev server; copy to /etc/cloudflared/config.yml
# and replace <TUNNEL-ID>. Created with (see README "Run the public dev server"):
#   cloudflared tunnel login
#   cloudflared tunnel create mitespotter-dev      # writes ~/.cloudflared/<TUNNEL-ID>.json
#   cloudflared tunnel route dns mitespotter-dev dev.mitespotter.org
# Copy the credentials file next to the config; never commit it. See planning.md "Deployment".

tunnel: mitespotter-dev
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  # Only the API exists yet. uvicorn listens on 127.0.0.1, so the tunnel is the only way in.
  - hostname: dev.mitespotter.org
    path: ^/api/
    service: http://127.0.0.1:6776
  - service: http_status:404
