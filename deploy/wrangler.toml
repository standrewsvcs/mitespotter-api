# deploy/wrangler.toml
# Cloudflare resources the backend relies on. The API itself runs on the VPS
# (see cloudflared.example.yml); this file only declares the R2 bucket.
#
#   npx wrangler r2 bucket create mitespotter-data
#   npx wrangler r2 bucket domain add mitespotter-data --domain data.mitespotter.org
#
# The API writes through R2's S3-compatible endpoint with an R2 API token
# (MITESPOTTER_R2_* in the environment, never committed). Objects are uploaded
# with `Cache-Control: public, max-age=31536000, immutable`.
# The frontend (mitespotter repo) proxies /data/* to the bucket's public domain.

name = "mitespotter-api-resources"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "DATA"
bucket_name = "mitespotter-data"
